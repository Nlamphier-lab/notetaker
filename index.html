<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notetaker — Live Lecture Captions & Smart Notes</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🎙️ Notetaker</h1>
    <div class="controls">
      <input type="text" id="lectureTitle" placeholder="Lecture Name (e.g. Psych 101)" />
      <button id="newBtn">+ New</button>
      <button id="startBtn">Start Listening</button>
      <button id="stopBtn" style="display:none;">Stop</button>
      <button id="summarizeBtn">Extract Notes Now</button>
      <button id="saveBtn">Save Lecture</button>
    </div>
  </header>

  <main class="workspace">
    <aside class="panel">
      <div class="panel-header">
        <h2>Saved Lectures</h2>
      </div>
      <ul id="sessionList" class="session-list"></ul>
    </aside>

    <section class="panel">
      <div class="panel-header">
        <h2>Live Captions</h2>
        <span id="micStatus" class="badge" style="background:#f3f4f6; color:#4b5563;">Mic Off</span>
      </div>
      <div id="captionsBox" class="content-box" contenteditable="true" title="Speak into your mic or click here to type/paste lecture text">
        <span id="finalTranscript"></span>
        <span id="interimTranscript" class="interim"></span>
      </div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2>Smart Study Notes</h2>
        <span id="autoStatus" class="badge">Auto-sync: 30s</span>
      </div>
      <div id="notesBox" class="content-box">
        <p style="color: #6b7280;">Click <strong>Start Listening</strong> (or paste lecture text into Live Captions). Key definitions, main concepts, and takeaways will automatically organize here every 30 seconds.</p>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
